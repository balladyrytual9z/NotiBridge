name: Build NotiBridge APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show project structure
        run: |
          echo "Root files:"
          ls -la
          echo "Gradle files:"
          find . -maxdepth 3 \( -name build.gradle -o -name build.gradle.kts -o -name settings.gradle -o -name settings.gradle.kts \) -print

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload generated APK files
        uses: actions/upload-artifact@v4
        with:
          name: NotiBridge-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
