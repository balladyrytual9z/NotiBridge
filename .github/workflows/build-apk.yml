name: Build NotiBridge APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Fix macOS Java home configuration
        shell: bash
        run: |
          if [ -f gradle.properties ]; then
            sed -i '/^[[:space:]]*org\.gradle\.java\.home[[:space:]]*=/d' gradle.properties
          fi

          find . -name gradle.properties \
            -not -path './.git/*' \
            -not -path './.gradle/*' \
            -exec sed -i '/^[[:space:]]*org\.gradle\.java\.home[[:space:]]*=/d' {} +

          echo "JAVA_HOME=$JAVA_HOME"
          java -version

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NotiBridge-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
